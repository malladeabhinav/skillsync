name: Deploy matching server to Render

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/render-server-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-matching
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Trigger Render deploy
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_MATCHING_SERVICE_ID }}
          COMMIT_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --data "{\"commitId\":\"${COMMIT_ID}\"}")
          deploy_id=$(printf '%s' "$response" | jq -r '.deploy.id // .id // empty')
          test -n "$deploy_id"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_MATCHING_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            response=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}")
            status=$(printf '%s' "$response" | jq -r '.status // empty')
            echo "Render deploy status: ${status}"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|deactivated|canceled|cancelled) exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for Render deploy"
          exit 1

      - name: Health check
        env:
          HEALTH_URL: ${{ secrets.RENDER_MATCHING_URL }}
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 10 "${HEALTH_URL%/}/" > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 5
          done
          echo "Matching server health check failed"
          exit 1
