name: Build matching server Docker image

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-docker.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-docker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: skillsync-matching:ci
