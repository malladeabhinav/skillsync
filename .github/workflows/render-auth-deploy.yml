name: Deploy auth backend to Render

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/render-auth-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-auth
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_AUTH_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --max-time 30 \
            -X POST \
            "$RENDER_DEPLOY_HOOK_URL"
          echo "Render auth deploy hook triggered"

      - name: Wait for auth health check
        env:
          HEALTH_URL: ${{ secrets.RENDER_AUTH_URL }}
        run: |
          set -euo pipefail
          test -n "$HEALTH_URL"
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 10 "${HEALTH_URL%/}/" > /tmp/health.json; then
              cat /tmp/health.json
              echo "Auth backend is healthy"
              exit 0
            fi
            echo "Waiting for auth backend... attempt ${i}/60"
            sleep 10
          done
          echo "Auth backend health check failed"
          exit 1
